<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DVD Screensaver</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #111 0%, #000 70%);
}

/* Фон с частицами */
#bg-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none; /* Пропускает клики сквозь себя */
}

/* Кнопка скачивания */
.download-btn {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    padding: 12px 28px;
    font-size: 16px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(45deg, #ff00ff, #00ffff);
    border: none;
    border-radius: 25px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    opacity: 1;
}

.download-btn:hover {
    transform: translateX(-50%) scale(1.05);
    box-shadow: 0 0 25px rgba(255, 0, 255, 0.8);
}

/* Класс для плавного скрытия интерфейса */
.hide-ui {
    opacity: 0 !important;
    pointer-events: none;
}

#dvd {
    position: absolute;
    z-index: 5;
    font-size: 90px;
    font-weight: 900;
    font-family: Arial, sans-serif;
    user-select: none;
    white-space: nowrap;

    background: linear-gradient(
        90deg,
        #ff0000,
        #ff8800,
        #ffff00,
        #00ff00,
        #00ffff,
        #0000ff,
        #ff00ff,
        #ff0000
    );

    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: rainbow 6s linear infinite;

    filter:
        drop-shadow(0 0 10px rgba(255,255,255,0.8))
        drop-shadow(0 0 25px rgba(255,255,255,0.5));
}

@keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}
</style>
</head>

<body>

<!-- Задний план (фигня из частиц) -->
<canvas id="bg-canvas"></canvas>

<!-- Логотип -->
<div id="dvd">DVD</div>

<!-- Кнопка скачивания (замените 'screensaver.exe' на реальный путь к файлу) -->
<a href="screensaver.exe" download class="download-btn" id="dl-btn">Скачать скринсейвер</a>

<script>
// --- КОД ДЛЯ DVD ЛОГОТИПА ---
const dvd = document.getElementById("dvd");

let x = Math.random() * (window.innerWidth - 200);
let y = Math.random() * (window.innerHeight - 100);
let vx = 3.2;
let vy = 2.6;
const MAX_SPEED = 6;

function clampSpeed() {
    vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, vx));
    vy = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, vy));
}

function randomBounce() {
    vx += (Math.random() - 0.5) * 0.8;
    vy += (Math.random() - 0.5) * 0.8;
    clampSpeed();
}

function animateDVD() {
    x += vx;
    y += vy;

    const w = dvd.offsetWidth;
    const h = dvd.offsetHeight;

    if (x <= 0) { x = 0; vx = Math.abs(vx); randomBounce(); } 
    else if (x + w >= window.innerWidth) { x = window.innerWidth - w; vx = -Math.abs(vx); randomBounce(); }

    if (y <= 0) { y = 0; vy = Math.abs(vy); randomBounce(); } 
    else if (y + h >= window.innerHeight) { y = window.innerHeight - h; vy = -Math.abs(vy); randomBounce(); }

    dvd.style.left = x + "px";
    dvd.style.top = y + "px";

    requestAnimationFrame(animateDVD);
}
animateDVD();


// --- КОД ЗАДНЕГО ПЛАНА (ЧАСТИЦЫ НА CANVAS) ---
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');

let particles = [];
const mouse = { x: null, y: null, radius: 100 };

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initParticles();
}

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = (Math.random() - 0.5) * 0.5;
        this.color = Math.random() > 0.5 ? '#ff00ff' : '#00ffff';
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;

        // Возврат при выходе за границы
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;

        // Магия при приближении мыши
        if (mouse.x && mouse.y) {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < mouse.radius) {
                this.x -= dx * 0.02;
                this.y -= dy * 0.02;
            }
        }
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function initParticles() {
    particles = [];
    const count = Math.floor((canvas.width * canvas.height) / 8000); // Плотность частиц
    for (let i = 0; i < count; i++) {
        particles.push(new Particle());
    }
}

function animateBackground() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
        p.update();
        p.draw();
    });
    requestAnimationFrame(animateBackground);
}

window.addEventListener('mousemove', (e) => {
    mouse.x = e.x;
    mouse.y = e.y;
});
window.addEventListener('mouseout', () => {
    mouse.x = null;
    mouse.y = null;
});


// --- СКРЫТИЕ КНОПКИ ПРИБЕЗДЕЙСТВИИ ---
const dlBtn = document.getElementById('dl-btn');
let timeout;

function resetTimer() {
    dlBtn.classList.remove('hide-ui');
    document.body.style.cursor = 'default';
    clearTimeout(timeout);
    timeout = setTimeout(() => {
        dlBtn.classList.add('hide-ui');
        document.body.style.cursor = 'none'; // Скрываем и курсор мыши
    }, 2500); // Исчезнет через 2.5 секунды тишины
}

window.addEventListener('mousemove', resetTimer);
window.addEventListener('mousedown', resetTimer);
window.addEventListener('keydown', resetTimer);


// Инициализация размеров при старте
window.addEventListener("resize", () => {
    x = Math.min(x, window.innerWidth - dvd.offsetWidth);
    y = Math.min(y, window.innerHeight - dvd.offsetHeight);
    resizeCanvas();
});
resizeCanvas();
animateBackground();
resetTimer();
</script>

</body>
</html>
